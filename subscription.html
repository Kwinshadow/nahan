<h2>Configuration</h2>

<div class="config">
    <b>Universal Subscription</b><br>

    <textarea
        id="normal"
        readonly
        placeholder="Loading configuration..."
    ></textarea>

    <br>

    <button onclick="copyConfig()">Copy</button>
</div>


<script>
const subscriptionUrl = "__SYNC_NORMAL__";

async function loadConfig() {
    const output = document.getElementById("normal");

    try {
        const response = await fetch(subscriptionUrl, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const base64 = await response.text();

        /*
         * Remove whitespace/newlines that may
         * exist in the Base64 response.
         */
        const cleanBase64 = base64
            .replace(/\s/g, "");

        /*
         * Decode Base64 as UTF-8.
         */
        const binary = atob(cleanBase64);

        const bytes = Uint8Array.from(
            binary,
            char => char.charCodeAt(0)
        );

        const decoded = new TextDecoder("utf-8").decode(bytes);

        output.value = decoded.trim();

    } catch (error) {

        output.value =
            "Unable to load configuration.\n\n" +
            error.message;
    }
}


async function copyConfig() {
    const output = document.getElementById("normal");

    try {
        await navigator.clipboard.writeText(output.value);

        alert("Configuration copied!");

    } catch (error) {

        output.select();
        output.setSelectionRange(0, 99999);

        document.execCommand("copy");

        alert("Configuration copied!");
    }
}


loadConfig();
</script>
